name: cleanup-posted-frames

on:
  schedule:
    # 09:00 America/Sao_Paulo (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clonar repositório de imagens
        env:
          IMAGE_REPO_TOKEN: ${{ secrets.IMAGE_REPO_TOKEN }}
        run: git clone "https://x-access-token:${IMAGE_REPO_TOKEN}@github.com/mrson93/titanic-frames-images.git" images-repo
      - name: Remover frames anteriores à janela de segurança
        run: python cleanup.py
      - name: Publicar remoções
        run: |
          cd images-repo
          git config user.name "titanic-frame-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -u frames
          git diff --cached --quiet || git commit -m "cleanup: manter apenas janela de 24 frames"
          git push
